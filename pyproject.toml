[project]
name = "nzshm-site-database"
version = "0.1.0"
description = "the Site Characterization Database for the New Zealand National Seismic Hazard Model (NSHM)"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-include-markdown-plugin>=7.1.3,<8.0",
    "mkdocs-material>=9.6.2,<10.0",
    "mkdocs-material-extensions>=1.3.1,<2.0",
    "mkdocstrings>=1.0.8,<2.0",
    "mkdocstrings-python>=2.0.10,<3.0",
    "mkdocs-pymdownx-material-extras>=2.7,<3.0",
    "mkdocs-table-reader-plugin>=4.0.2,<5.0",
    "gitpython>=3.1.44,<4.0",
    "jinja2>=3.1.6,<4.0",
]

[project.optional-dependencies]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "ruff",
]
doc = [
    "nzshm-common>=0.10.1,<0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nzshm_site_database"]

[tool.uv]
exclude-newer = "1 week"
# nzshm* packages ship fresh — always resolve to latest.
exclude-newer-package = { "nzshm-common" = false }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "G004"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "preserve"
