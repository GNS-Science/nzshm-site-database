[tool.poetry]
name = "nzshm-site-database"
version = "0.1.0"
description = "the Site Characterization Database for the New Zealand National Seismic Hazard Model (NSHM)"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
mkdocs = "^1.6.1"
mkdocs-include-markdown-plugin = "^7.1.3"
mkdocs-material = "^9.6.2"
mkdocs-material-extensions = "^1.3.1"
mkdocstrings = "^0.28.0"
mkdocstrings-python = "^1.14.5"
mkdocs-pymdownx-material-extras = "^2.7"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
