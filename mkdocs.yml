site_name: New Zealand Site Characterization Database
site_url: https://gns-science.github.io/nzshm-site-database
repo_url: https://github.com/gns-science/nzshm-site-database
repo_name: Gns-science/nzshm-site-database
docs_dir: nzshm_site_database/docs

nav:
  - New Zealand Site Characterization Database: index.md
  - The Database: database.md
  - Supporting Data: sites.md
  - Previous Versions: previous_versions.md
  - Help: help.md

theme:
  name: material
  language: en
  #logo: assets/logo.png
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.tabs
  #   - navigation.tabs.sticky
markdown_extensions:
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      baselevel: 2
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: none}}
  - tables
  - admonition
  - footnotes  
  - pymdownx.details

extra_css:
  - css/table.css

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js

plugins:
  - include-markdown
  - search:
      lang: en
  - table-reader
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gns-science/nzshm-site-database
      name: Github
    - icon: material/email
      link: "mailto:nshm@gns.cri.nz"
