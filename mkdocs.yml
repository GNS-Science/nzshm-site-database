site_name: New Zealand Site Characterization Database
site_url: https://chrisdicaprio.github.io/nzshm-site-database
repo_url: https://github.com/chrisdicaprio/nzshm-site-database
repo_name: chrisdicaprio/nzshm-site-database
docs_dir: nzshm_site_database

nav:
  - About: docs/index.md
  - The Database: docs/database.md
  - Supporting Data: docs/sites.md

theme:
  name: material
  language: en
  #logo: assets/logo.png
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.tabs
  #   - navigation.tabs.sticky
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      baselevel: 2
      permalink: true
      slugify: !!python/name:pymdownx.slugs.uslugify
  - tables
  - admonition
  - footnotes  
  - pymdownx.details

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js

plugins:
  - include-markdown
  - search:
      lang: en
  - table-reader
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chrisdicaprio/nzshm-site-database
      name: Github
    - icon: material/email
      link: "mailto:nshm@gns.cri.nz"
